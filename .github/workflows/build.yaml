name: Build & Push Images (x86)

# Manually triggered: Actions tab -> "Build & Push Images (x86)" -> Run workflow.
# Builds all 8 WIP service images via scripts/build-release.sh (wip-auth /
# WIP-Toolkit baked in) and pushes them to GHCR as
# ghcr.io/<owner>/<service>:<tag>.
#
# Tag convention: version tags (e.g. 1.2.0) are write-once — never re-push an
# existing version, bump instead. An empty tag input falls back to sha-<short>.
#
# Platforms: default is native amd64 (fast path, docker builder). Setting the
# platforms input to e.g. "linux/amd64,linux/arm64" switches to podman +
# QEMU emulation — build-release.sh's --platforms path uses podman manifest
# commands, which plain docker does not support. Emulated arm64 builds are
# slow (expect 2-3x per emulated arch).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 1.2.0). Leave empty for sha-<short-commit>.'
        required: false
        default: ''
      platforms:
        description: 'Comma-separated platforms. Default native amd64; e.g. linux/amd64,linux/arm64 for multi-arch (QEMU, slow).'
        required: false
        default: 'linux/amd64'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building with tag: $TAG"

      - name: Set up QEMU (multi-arch only)
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Ensure podman is available (multi-arch only)
        if: inputs.platforms != 'linux/amd64'
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update && sudo apt-get install -y podman
          fi
          podman --version

      - name: Build and push all images
        run: |
          PLATFORMS="${{ inputs.platforms }}"
          if [ "$PLATFORMS" = "linux/amd64" ]; then
            # Native fast path: docker builder, per-image push.
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            bash scripts/build-release.sh \
              --registry "ghcr.io/${{ github.repository_owner }}" \
              --tag "${{ steps.tag.outputs.tag }}" \
              --push \
              --builder docker
          else
            # Multi-arch path: podman manifest lists + QEMU emulation.
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              podman login ghcr.io -u "${{ github.actor }}" --password-stdin
            bash scripts/build-release.sh \
              --registry "ghcr.io/${{ github.repository_owner }}" \
              --tag "${{ steps.tag.outputs.tag }}" \
              --platforms "$PLATFORMS" \
              --push \
              --builder podman
          fi
