name: Build & Push Images

# Manually triggered: Actions tab -> "Build & Push Images" -> Run workflow.
# Builds all 8 WIP service images via scripts/build-release.sh (wip-auth /
# WIP-Toolkit baked in) and pushes them to GHCR as
# ghcr.io/<owner>/<service>:<tag>.
#
# Architecture: one NATIVE job per arch (amd64 on ubuntu-latest, arm64 on
# GitHub's native arm runner ubuntu-24.04-arm — free for public repos), each
# pushing <tag>-<arch>, then a stitch job welds the per-arch images into one
# multi-arch index under the bare <tag> via `docker buildx imagetools create`
# (manifest-only, no rebuild). No QEMU anywhere. The stitch job only runs if
# BOTH arch builds succeed, so a bare <tag> is never a half-index, and both
# halves are always built from the same commit.
#
# This replaced the single-job QEMU path: it was slow (2-3x per emulated
# arch) and its platform parsing choked on "linux/amd64, linux/arm64"
# (comma+space) until build-release.sh learned to trim — but native-per-arch
# is the better shape regardless. App repos should copy this pattern for
# their own image builds.
#
# Tag convention: version tags (e.g. 1.2.0, 20260703a) are write-once —
# never re-push an existing version, bump instead. An empty tag input falls
# back to sha-<short>. The per-arch tags (<tag>-amd64, <tag>-arm64) are
# provenance; deploys pin the bare <tag>.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 20260703a). Leave empty for sha-<short-commit>.'
        required: false
        default: ''

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building with tag: $TAG (arch images: $TAG-amd64, $TAG-arm64)"

  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and push all images (${{ matrix.arch }}, native)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          bash scripts/build-release.sh \
            --registry "ghcr.io/${{ github.repository_owner }}" \
            --tag "${{ needs.resolve-tag.outputs.tag }}-${{ matrix.arch }}" \
            --push \
            --builder docker

  stitch:
    # Runs only if BOTH arch builds succeeded — a bare <tag> is never a
    # half-index, and both halves come from this run's single commit.
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Stitch per-arch images into multi-arch tags
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          OWNER="ghcr.io/${{ github.repository_owner }}"
          # Service list mirrors AUTH_SERVICES + PLAIN_SERVICES in
          # scripts/build-release.sh — update both together.
          FAILED=""
          for svc in registry def-store template-store document-store \
                     reporting-sync ingest-gateway mcp-server auth-gateway; do
            echo "::group::$svc"
            if docker buildx imagetools create \
                 -t "$OWNER/$svc:$TAG" \
                 "$OWNER/$svc:$TAG-amd64" \
                 "$OWNER/$svc:$TAG-arm64"; then
              docker buildx imagetools inspect "$OWNER/$svc:$TAG" | head -20
            else
              FAILED="$FAILED $svc"
            fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Stitch failed for:$FAILED"
            exit 1
          fi
          echo "Done: $TAG is a multi-arch index (amd64+arm64) for all 8 services."
