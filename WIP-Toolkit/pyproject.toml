[project]
name = "wip-toolkit"
version = "0.6.1"
description = "Backup, migration, and data management toolkit for World In a Pie (WIP)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
    # The archive format contract + id remapping live in libs/wip-archive
    # (a path-dep sibling of wip-auth, not on PyPI): repo installs get it
    # via `-e ../libs/wip-archive`; wheel consumers install both wheels.
    # The floor is the oldest archive this toolkit's imports exist in
    # (wip_archive.model); without it pip accepts any installed archive.
    "wip-archive>=0.2.0",
]

[project.scripts]
wip-toolkit = "wip_toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wip_toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
