api_version: wip.dev/v1
kind: Component
metadata:
  name: mongodb
  category: infrastructure
  description: |
    MongoDB primary document store. Hosts per-service databases
    (wip_registry, wip_def_store, wip_template_store, wip_document_store).
    Always deployed — every WIP core service depends on it.

spec:
  image:
    name: docker.io/library/mongo
    tag: "7"

  # Cap WiredTiger's cache. Default ceiling is 50% x (RAM - 1GB); against an
  # 8GB VM with no per-container memory limit that lets Mongo grow its cache
  # toward ~3.6GB, oversized for WIP's Pi-to-dev footprint. 1GB keeps the cache
  # bounded (total RSS lands a few hundred MB above this).
  #
  # argv[0] MUST stay docker-entrypoint.sh, NOT bare mongod. The renderers
  # replace the image ENTRYPOINT with this argv (compose splits it into
  # entrypoint + command, k8s uses command:), so a bare `mongod` here would
  # bypass the mongo image's docker-entrypoint.sh — and that script injects
  # --bind_ip_all. Without it mongod falls back to its localhost-only default
  # bindIp: the DB comes up "healthy" on the container's own TCP probe but
  # REFUSES every cross-container connection, so registry/def-store/
  # template-store/document-store all fail Beanie init with "Connection
  # refused". Passing docker-entrypoint.sh as argv[0] re-runs the full stock
  # setup (bind_ip_all, MONGO_INITDB_* bootstrap, /data/db perms) and just
  # appends our cache flag.
  command: [docker-entrypoint.sh, mongod, --wiredTigerCacheSizeGB, "1.0"]

  ports:
    - {name: mongo, container_port: 27017}

  env:
    optional:
      - {name: MONGO_INITDB_ROOT_USERNAME, source: {from_secret: mongo-user}}
      - {name: MONGO_INITDB_ROOT_PASSWORD, source: {from_secret: mongo-password}}

  storage:
    - {name: data, mount_path: /data/db, size: 20Gi}

  healthcheck:
    # TCP accept probe, deliberately NOT mongosh: mongosh is a full Node.js
    # process forked per probe, and under host/VM load those spawns overrun
    # the timeout, pile up as zombies, and amplify a merely-slow VM into an
    # unresponsive one. A TCP accept costs ~nothing and cannot amplify; deep
    # liveness comes from the core services' own MongoDB connection errors,
    # which they already surface loudly.
    command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
    interval_seconds: 30
    timeout_seconds: 10
    start_period_seconds: 15
    retries: 5

  # CASE-359: mongodb exists to store data for the core services
  # (registry, def-store, template-store, document-store). When an
  # apps-only install suppresses core, mongodb has no callers and
  # auto-deactivates with this predicate.
  activation:
    requires_core: true
