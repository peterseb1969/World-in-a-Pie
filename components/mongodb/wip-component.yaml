api_version: wip.dev/v1
kind: Component
metadata:
  name: mongodb
  category: infrastructure
  description: |
    MongoDB primary document store. Hosts per-service databases
    (wip_registry, wip_def_store, wip_template_store, wip_document_store).
    Always deployed — every WIP core service depends on it.

spec:
  image:
    name: docker.io/library/mongo
    tag: "7"

  # The deployer renders the start script (config_gen/mongodb.py) and mounts
  # it at /etc/wip-mongo/entrypoint.sh. On every start it creates or updates
  # root and one user per component/app that declares a `mongo_client` (each
  # limited to its databases) through a temporary mongod without --auth on
  # 127.0.0.1:27018, then serves with --auth --bind_ip_all. Passwords arrive
  # as MONGO_ROOT_PASSWORD / MONGO_PASSWORD_* env, injected by the deployer.
  # The arguments after the script go to both mongod runs: cap WiredTiger's
  # cache (default 50% x (RAM - 1GB) grows toward ~3.6GB on an 8GB VM, far
  # beyond WIP's Pi-to-dev footprint).
  command: [bash, /etc/wip-mongo/entrypoint.sh, --wiredTigerCacheSizeGB, "1.0"]

  ports:
    - {name: mongo, container_port: 27017}

  storage:
    - {name: data, mount_path: /data/db, size: 20Gi}

  healthcheck:
    # TCP accept probe, deliberately NOT mongosh: mongosh is a full Node.js
    # process forked per probe, and under host/VM load those spawns overrun
    # the timeout, pile up as zombies, and amplify a merely-slow VM into an
    # unresponsive one. A TCP accept costs ~nothing and cannot amplify; deep
    # liveness comes from the core services' own MongoDB connection errors,
    # which they already surface loudly.
    command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
    interval_seconds: 30
    timeout_seconds: 10
    start_period_seconds: 15
    retries: 5

  # CASE-359: mongodb exists to store data for the core services
  # (registry, def-store, template-store, document-store). When an
  # apps-only install suppresses core, mongodb has no callers and
  # auto-deactivates with this predicate.
  activation:
    requires_core: true
