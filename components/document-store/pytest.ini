# Component-local pytest config — overrides the repo-root
# [tool.pytest.ini_options] entirely (closest config wins), so the root
# options are replicated here alongside the additions.
#
# The session-scoped asyncio loop is what makes the suite fast: motor
# clients are event-loop-bound, and under the default function-scoped
# loops the conftest had to rebuild the mongo client and re-run
# init_beanie for every test — measured at ~69% of suite wall time.
# One loop per session (per xdist worker process) lets the client and
# beanie bindings live for the whole run. Scoped to this component only:
# the other suites keep function-scoped loops until someone validates
# them the same way.
[pytest]
asyncio_mode = auto
testpaths = tests
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
