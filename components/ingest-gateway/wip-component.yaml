api_version: wip.dev/v1
kind: Component
metadata:
  name: ingest-gateway
  category: optional
  description: |
    Async bulk ingestion via NATS JetStream. Accepts high-throughput
    document streams and emits validated writes into Document-Store
    via NATS consumers. Requires nats to be deployed.

spec:
  image:
    name: ingest-gateway
    build_context: .

  ports:
    - {name: http, container_port: 8006}

  command: [uvicorn, ingest_gateway.main:app, --host, 0.0.0.0, --port, "8006"]

  env:
    required:
      - {name: NATS_URL, source: {from_component: nats}}
      - {name: DEF_STORE_URL, source: {from_component: def-store}}
      - {name: TEMPLATE_STORE_URL, source: {from_component: template-store}}
      - {name: DOCUMENT_STORE_URL, source: {from_component: document-store}}
      - {name: MASTER_API_KEY, source: {from_secret: api-key}}
      # Outbound credential for document-store calls.
      - {name: DOCUMENT_STORE_API_KEY, source: {from_secret: api-key}}
      # Outbound credential the gateway reads as settings.api_key for ALL
      # service-to-service calls. Without it the config fell back to the dev
      # default and every outbound call was refused.
      - {name: API_KEY, source: {from_secret: api-key}}
      # Inbound authentication (wip-auth): runtime-key sync and any
      # permission lookup ask the Registry.
      - {name: REGISTRY_URL, source: {from_component: registry}}
      - {name: REGISTRY_API_KEY, source: {from_secret: api-key}}
      # Derived from deployment.spec.auth.mode (CASE-361). See registry
      # manifest for the full mapping rationale.
      - {name: WIP_AUTH_MODE, source: {from_spec: auth.wip_auth_mode}}
      # Security posture — arms the WIP_VARIANT=prod startup guard (refuse
      # to start on known-default secrets). From the deployment's --variant.
      - {name: WIP_VARIANT, source: {from_spec: security.variant}}
      # Spec-declared config-file API keys (deployment auth.api_keys);
      # empty when none are declared — wip-auth treats empty as unset.
      - {name: WIP_AUTH_API_KEYS_FILE, source: {from_spec: security.api_keys_file}}
    optional:
      - {name: CORS_ORIGINS, source: {from_spec: network.cors_origins}}
      # JWT issuer URL — honored in jwt_only / dual; ignored otherwise. CASE-361.
      - {name: WIP_AUTH_JWT_ISSUER_URL, source: {from_spec: auth.issuer_url_internal}}

  routes:
    - {path: /api/ingest-gateway, auth_required: false}

  depends_on: [nats, registry, def-store, template-store, document-store]

  healthcheck:
    endpoint: /api/ingest-gateway/health
    start_period_seconds: 20
