api_version: wip.dev/v1
kind: Component
metadata:
  name: reporting-sync
  category: optional
  description: |
    Syncs MongoDB document changes into PostgreSQL via NATS events.
    Enables SQL analytics, cross-template JOINs, and aggregation
    queries via run_report_query. Requires postgres + nats to be
    deployed; activating this module auto-activates them.

spec:
  image:
    name: reporting-sync
    build_context: .

  ports:
    - {name: http, container_port: 8005}

  command: [uvicorn, reporting_sync.main:app, --host, 0.0.0.0, --port, "8005"]

  env:
    required:
      - {name: NATS_URL, source: {from_component: nats}}
      - {name: POSTGRES_HOST, source: {from_component_host: postgres}}
      - {name: POSTGRES_PORT, source: {from_component_port: postgres}}
      - {name: POSTGRES_DB, source: {literal: wip_reporting}}
      - {name: POSTGRES_USER, source: {literal: wip}}
      - {name: POSTGRES_PASSWORD, source: {from_secret: postgres-password}}
      # The service's own unprivileged roles (pg_roles.py). POSTGRES_USER /
      # POSTGRES_PASSWORD above are the bootstrap login, used once at
      # startup to provision these; requests run as these two roles.
      - {name: POSTGRES_SYNC_OWNER_PASSWORD, source: {from_secret: postgres-sync-owner-password}}
      - {name: POSTGRES_READ_PASSWORD, source: {from_secret: postgres-reporting-read-password}}
      - {name: DEF_STORE_URL, source: {from_component: def-store}}
      - {name: TEMPLATE_STORE_URL, source: {from_component: template-store}}
      - {name: DOCUMENT_STORE_URL, source: {from_component: document-store}}
      # Namespace authorization and runtime-key sync ask the Registry
      # (check_namespace_permission / setup_key_sync). Without these the
      # permission lookups fail closed and runtime keys never arrive.
      - {name: REGISTRY_URL, source: {from_component: registry}}
      - {name: REGISTRY_API_KEY, source: {from_secret: api-key}}
      - {name: MASTER_API_KEY, source: {from_secret: api-key}}
      # Outbound credential reporting-sync uses for ALL service-to-service
      # HTTP calls (def-store, template-store, document-store). The
      # batch_sync methods read this as settings.api_key. Without it,
      # the config falls back to the dev default and every outbound call
      # returns 401.
      - {name: API_KEY, source: {from_secret: api-key}}
      # Derived from deployment.spec.auth.mode (CASE-361). See registry
      # manifest for the full mapping rationale.
      - {name: WIP_AUTH_MODE, source: {from_spec: auth.wip_auth_mode}}
      # Security posture — arms the WIP_VARIANT=prod startup guard (refuse
      # to start on known-default secrets). From the deployment's --variant.
      - {name: WIP_VARIANT, source: {from_spec: security.variant}}
      # Spec-declared config-file API keys (deployment auth.api_keys);
      # empty when none are declared — wip-auth treats empty as unset.
      - {name: WIP_AUTH_API_KEYS_FILE, source: {from_spec: security.api_keys_file}}
    optional:
      - {name: CORS_ORIGINS, source: {from_spec: network.cors_origins}}
      # JWT validation (issuer, signing keys, accepted audiences) — honored
      # in jwt_only / dual; ignored otherwise.
      - {name: WIP_AUTH_JWT_ISSUER_URL, source: {from_spec: auth.issuer_url_public}}
      - {name: WIP_AUTH_JWT_JWKS_URI, source: {from_spec: auth.jwks_url_internal}}
      - {name: WIP_AUTH_JWT_AUDIENCE, source: {from_spec: auth.jwt_audience}}

  # NATS user for this service (config_gen/nats.py). It may publish only the
  # JetStream API it needs: ensure WIP_EVENTS, and create/read/pull/ack its own
  # durable consumer. It publishes no events and cannot delete streams.
  nats_client:
    publish:
      - "$JS.API.STREAM.INFO.WIP_EVENTS"
      - "$JS.API.STREAM.CREATE.WIP_EVENTS"
      - "$JS.API.STREAM.UPDATE.WIP_EVENTS"
      - "$JS.API.CONSUMER.INFO.WIP_EVENTS.reporting-sync-durable"
      - "$JS.API.CONSUMER.CREATE.WIP_EVENTS.reporting-sync-durable"
      - "$JS.API.CONSUMER.CREATE.WIP_EVENTS.reporting-sync-durable.>"
      - "$JS.API.CONSUMER.DURABLE.CREATE.WIP_EVENTS.reporting-sync-durable"
      - "$JS.API.CONSUMER.MSG.NEXT.WIP_EVENTS.reporting-sync-durable"
      - "$JS.ACK.WIP_EVENTS.reporting-sync-durable.>"

  routes:
    - {path: /api/reporting-sync, auth_required: false}

  depends_on: [nats, postgres, registry, def-store, template-store, document-store]

  healthcheck:
    endpoint: /health
    start_period_seconds: 20
