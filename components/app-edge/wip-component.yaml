api_version: wip.dev/v1
kind: Component
metadata:
  name: app-edge
  category: infrastructure
  description: |
    Serves the apps attached under the umbrella through the Registry's API.
    A Caddy whose config a sync loop rebuilds from the Registry's attachment
    records: every /apps/<name> of an active attachment goes through the
    auth gateway, then to the upstream the record names, dialled at the
    address the loop resolved and checked against the install's blocklist.
    Deployer apps keep their own, more specific routes; the public router
    hands the rest of /apps to this edge.

spec:
  image:
    name: app-edge
    build_context: .

  ports:
    - {name: http, container_port: 8080}

  routes:
    # Everything under /apps that no deployer app's longer route claims.
    # Not behind the gateway here: the edge runs forward_auth itself, per
    # attachment, with that record's allowed groups.
    - {path: /apps, auth_required: false, redirect_bare_path: false}

  activation:
    # The edge's routes are gateway-protected and its records live in the
    # Registry: no gateway, or an apps-only install, means no edge.
    requires_auth_gateway: true
    requires_core: true

  env:
    required:
      - {name: REGISTRY_URL, source: {from_component: registry}}
      # The edge's own key: group wip-app-edge, which may read attachments
      # and nothing else (no namespace scope, cannot assert identities).
      - {name: EDGE_API_KEY, source: {from_secret: wip-app-edge-api-key}}
      - {name: GATEWAY_URL, source: {from_component: auth-gateway}}
      # The URL browsers see. The edge sets X-Forwarded-Proto/Host from it
      # instead of trusting the incoming ones, so the gateway's login
      # redirect is right and a client cannot spoof either header.
      - {name: PUBLIC_BASE_URL, source: {from_spec: network.public_base_url}}
      # The install's own hosts, which an upstream may never resolve to.
      - {name: WIP_ATTACH_POLICY_FILE, source: {from_spec: security.attach_policy_file}}
      # The deployer's one definition of the identity headers (see
      # config_gen/routing.py): what the gateway hands on, and what a
      # client-sent request may carry that the edge removes.
      - {name: GATEWAY_IDENTITY_HEADERS, source: {from_spec: security.gateway_identity_headers}}
      - {name: CLIENT_IDENTITY_HEADERS, source: {from_spec: security.client_identity_headers}}

  depends_on: [registry, auth-gateway]

  healthcheck:
    endpoint: /edge/health
    probe: auto
    start_period_seconds: 10
