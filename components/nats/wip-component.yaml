api_version: wip.dev/v1
kind: Component
metadata:
  name: nats
  category: infrastructure
  description: |
    NATS JetStream message queue. Carries document change events from
    Document-Store to Reporting-Sync, and bulk ingestion streams from
    Ingest-Gateway. Active when either reporting or ingest module is
    enabled.

spec:
  image:
    name: docker.io/library/nats
    # Alpine variant carries busybox (wget included): the healthcheck runs
    # inside the container on every target, because the monitor listens on
    # 127.0.0.1 only. The scratch-based nats:2 image has no shell/wget.
    tag: "2-alpine"

  # Only the client port is exposed. The monitoring endpoint (8222) has no
  # authentication of its own and `/connz` lists every client, so the
  # rendered config binds it to 127.0.0.1 and the healthcheck probes it
  # from inside the container.
  ports:
    - {name: nats, container_port: 4222}

  # The deployer renders the server config (config_gen/nats.py) and mounts
  # it at /etc/nats/nats.conf: JetStream with its store on the `jetstream`
  # volume below, the monitor on localhost, and one authenticated user per
  # component that declares a `nats_client` — each limited to its own
  # subjects. The users' passwords arrive as NATS_PASSWORD_* env (injected
  # by the deployer) and the config references them by name.
  # Full argv (including binary) so k8s's `command:` replacement works;
  # `nats-server` (PATH-relative) works on nats:2-alpine (binary at
  # /usr/local/bin/nats-server).
  command: [nats-server, -c, /etc/nats/nats.conf]

  storage:
    - {name: jetstream, mount_path: /data, size: 5Gi}

  healthcheck:
    command: [wget, -q, -O, /dev/null, "http://127.0.0.1:8222/healthz"]
    interval_seconds: 10
    timeout_seconds: 5
    start_period_seconds: 10
    retries: 3

  activation:
    requires_any_module: [reporting-sync, ingest-gateway]
