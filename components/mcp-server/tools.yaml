# WIP MCP Server — OpenAPI mapping for tool parameters
#
# Input to scripts/generate_schemas.py only; the server never reads this file.
# The generator writes everything the server needs into
# src/wip_mcp/_generated_schemas.py, which ships with the package.
#
# A tool's prose lives in its docstring in server.py. For each tool listed
# here, the server appends the generated field list to that docstring and
# replaces the named parameter's JSON schema with the OpenAPI model.
#
# Fields:
#   openapi_schema: "service#ModelName" — the OpenAPI request model
#   param_name: the function parameter that receives it (null: field list only)
#   param_type: "list" if the parameter is list[dict]; omit for a single dict
#   nested_schemas: further models whose fields are listed too

tools:
  # -- Terminologies --
  create_terminology:
    openapi_schema: "def-store#CreateTerminologyRequest"
    param_name: null  # scalar params; the schema only feeds the field list

  create_terminologies_bulk:
    openapi_schema: "def-store#CreateTerminologyRequest"
    param_name: "items"
    param_type: list

  # -- Terms --
  create_terms:
    openapi_schema: "def-store#CreateTermRequest"
    param_name: "terms"
    param_type: list

  # -- Ontology --
  create_term_relations:
    openapi_schema: "def-store#CreateTermRelationRequest"
    param_name: "term_relations"
    param_type: list

  # -- Templates --
  create_template:
    openapi_schema: "template-store#CreateTemplateRequest"
    param_name: "template"
    nested_schemas:
      - "template-store#FieldDefinition"

  create_templates_bulk:
    openapi_schema: "template-store#CreateTemplateRequest"
    param_name: "templates"
    param_type: list
    nested_schemas:
      - "template-store#FieldDefinition"

  # -- Documents --
  create_document:
    openapi_schema: "document-store#DocumentCreateRequest"
    param_name: "document"

  create_documents_bulk:
    openapi_schema: "document-store#DocumentCreateRequest"
    param_name: "documents"
    param_type: list
