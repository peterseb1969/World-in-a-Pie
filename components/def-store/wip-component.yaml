api_version: wip.dev/v1
kind: Component
metadata:
  name: def-store
  category: core
  description: |
    Terminology management. Stores controlled vocabularies and terms
    with ontology term-relations. Consumed by Template-Store for term
    validation on document fields.

spec:
  image:
    name: def-store
    build_context: .

  ports:
    - {name: http, container_port: 8002}

  command: [uvicorn, def_store.main:app, --host, 0.0.0.0, --port, "8002"]

  env:
    required:
      - {name: MONGO_URI, source: {from_component: mongodb}}
      - {name: DATABASE_NAME, source: {literal: wip_def_store}}
      - {name: REGISTRY_URL, source: {from_component: registry}}
      - {name: MASTER_API_KEY, source: {from_secret: api-key}}
      # Outbound credential used when this service calls registry
      # (api-keys/sync on startup, namespace lookups, etc.). Must
      # match registry's MASTER_API_KEY.
      - {name: REGISTRY_API_KEY, source: {from_secret: api-key}}
      # Derived from deployment.spec.auth.mode (CASE-361). See registry
      # manifest for the full mapping rationale.
      - {name: WIP_AUTH_MODE, source: {from_spec: auth.wip_auth_mode}}
      # Security posture — arms the WIP_VARIANT=prod startup guard (refuse
      # to start on known-default secrets). From the deployment's --variant.
      - {name: WIP_VARIANT, source: {from_spec: security.variant}}
      # Spec-declared config-file API keys (deployment auth.api_keys);
      # empty when none are declared — wip-auth treats empty as unset.
      - {name: WIP_AUTH_API_KEYS_FILE, source: {from_spec: security.api_keys_file}}
      # Outbound call used by the terminology-delete guard: it lists
      # templates to refuse deleting a terminology that templates still
      # reference. Unset, the check cannot run and every non-forced
      # delete is refused (the guard fails closed).
      - {name: TEMPLATE_STORE_URL, source: {from_component: template-store}}
      - {name: TEMPLATE_STORE_API_KEY, source: {from_secret: api-key}}
    optional:
      - {name: CORS_ORIGINS, source: {from_spec: network.cors_origins}}
      # NATS is optional — only present when reporting or ingest module active.
      # Def-store publishes terminology/term/term_relation events here;
      # reporting-sync's worker consumes them to populate metadata tables
      # in real time. When NATS_URL is empty the service gracefully skips.
      - {name: NATS_URL, source: {from_component: nats}}
      # JWT validation (issuer, signing keys, accepted audiences) — honored
      # in jwt_only / dual; ignored otherwise.
      - {name: WIP_AUTH_JWT_ISSUER_URL, source: {from_spec: auth.issuer_url_public}}
      - {name: WIP_AUTH_JWT_JWKS_URI, source: {from_spec: auth.jwks_url_internal}}
      - {name: WIP_AUTH_JWT_AUDIENCE, source: {from_spec: auth.jwt_audience}}
      # Groups of logins federated through a Dex connector: reserved groups
      # stripped, auth.group_mappings applied. Empty without connectors.
      - {name: WIP_AUTH_FEDERATED_GROUPS, source: {from_spec: auth.federated_groups}}

  # NATS user for this service (config_gen/nats.py). It may publish only the
  # events it emits, plus the stream API that ensures WIP_EVENTS (EventBus
  # creates or converges the stream after every connect).
  nats_client:
    publish:
      - "wip.terminologies.>"
      - "wip.terms.>"
      - "wip.term_relations.>"
      - "$JS.API.STREAM.INFO.WIP_EVENTS"
      - "$JS.API.STREAM.CREATE.WIP_EVENTS"
      - "$JS.API.STREAM.UPDATE.WIP_EVENTS"

  # MongoDB user for this service (config_gen/mongodb.py): its own database.
  mongo_client:
    databases: [wip_def_store]

  routes:
    - {path: /api/def-store, auth_required: false}

  depends_on: [mongodb, registry]

  healthcheck:
    # Readiness pings MongoDB (503 while it is unreachable); liveness does no
    # I/O, so a MongoDB outage stops routing instead of restarting the pod.
    endpoint: /ready
    liveness_endpoint: /livez
