api_version: wip.dev/v1
kind: Component
metadata:
  name: router
  category: infrastructure
  description: |
    Internal HTTP aggregator for apps that proxy API calls server-side.
    Apps point `WIP_BASE_URL` at this service; the router reverse-
    proxies /api/* to the correct backend (registry, def-store, etc.).

    Replaces the compose-era hardcoded `http://wip-caddy:8080` — same
    role, now an explicit Component visible to both compose and k8s
    renderers.

spec:
  image:
    # Fully-qualified upstream image. Without the `docker.io/library/`
    # prefix, the renderer's short-name logic would prepend
    # spec.images.registry (ghcr.io/peterseb1969/...) and the pull would
    # fail. Caddy isn't published by WIP — it's an upstream dependency.
    name: docker.io/library/caddy
    tag: "2"

  ports:
    - {name: http, container_port: 8080}

  # Caddy runs the generated Caddyfile from /etc/caddy/Caddyfile.
  # Both renderers mount a config file at that path — compose via
  # bind-mount, k8s via ConfigMap (see renderer-side special-case
  # until config_files generalization lands).
  command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]

  # The router has no `/` route — bare `/` reaches the terminal
  # catch-all (caddy_common.write_unrouted_404) and gets a 404, so
  # `curl -f` prints an error and exits 22. That is still a liveness
  # signal (the listener answered), and the probe ignores the status:
  # the pipeline's exit is grep's, which accepts any 3-digit HTTP code.
  # `--max-time 5` matches the default timeout_seconds: compose's timeout
  # does not kill the probe, so an unbounded curl would pile up.
  healthcheck:
    command: ["sh", "-c", "curl -fsS --max-time 5 -o /dev/null -w '%{http_code}' http://localhost:8080/ | grep -qE '^[0-9]{3}$'"]
    start_period_seconds: 5

  # CASE-359: the router only routes to internal core services. In
  # apps-only installs (suppress_core=True), there's nothing to route
  # to — the router auto-deactivates. Apps that need a remote WIP
  # in apps-only mode must use `from_spec: network.external_base_url`
  # (CASE-358) instead of `from_component: router` for WIP_BASE_URL.
  activation:
    requires_core: true

