name: Tests
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Fast lint checks (parallel with tests)
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install tools
        run: |
          . .venv/bin/activate
          # radon is pinned like the quality audit's: its complexity counts
          # shift across releases, and the ratchet compares counts.
          pip install ruff shellcheck-py radon==6.0.1

      - name: Complexity ratchet (changed files only)
        run: |
          . .venv/bin/activate
          python3 scripts/check-complexity-ratchet.py --base HEAD~1 --head HEAD

      - name: Release-note fragments
        run: |
          # One file per entry under docs/releases/unreleased/; refuses a
          # malformed fragment and a recreated shared unreleased.md.
          python3 scripts/release-notes.py check

      - name: Platform components carry one version
        run: |
          # The services, auth-gateway, mcp-server, wip-auth and wip-deploy carry
          # the release number; only the release cut changes it, never a fix.
          python3 scripts/lib_artifacts.py platform

      - name: Ruff (changed files only)
        run: |
          . .venv/bin/activate
          CHANGED_PY=$(git diff --name-only --diff-filter=d HEAD~1 -- '*.py')
          if [ -n "$CHANGED_PY" ]; then
            echo "$CHANGED_PY" | xargs ruff check --config pyproject.toml --output-format=github
          else
            echo "No Python files changed"
          fi

      - name: ShellCheck (changed files only)
        run: |
          . .venv/bin/activate
          CHANGED_SH=$(git diff --name-only --diff-filter=d HEAD~1 -- '*.sh')
          if [ -n "$CHANGED_SH" ]; then
            echo "$CHANGED_SH" | xargs shellcheck
          else
            echo "No shell files changed"
          fi

      - name: Bandit security scan (changed files only)
        run: |
          . .venv/bin/activate
          pip install bandit
          CHANGED_PY=$(git diff --name-only --diff-filter=d HEAD~1 -- '*.py')
          if [ -n "$CHANGED_PY" ]; then
            # Fails on any medium+ finding. Accepted ones are marked in place
            # with "# nosec <test-id>" and the reason they are safe.
            echo "$CHANGED_PY" | xargs bandit -c pyproject.toml --severity-level medium -f txt
          else
            echo "No Python files changed"
          fi

  # Library build output is never tracked: the scaffold builds the npm
  # tarballs and wheels apps vendor, under versions computed from git
  # (scripts/lib_artifacts.py). A tracked tarball or dist/ would be a second,
  # hand-maintained copy that goes stale under an unchanged name.
  lib-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No library build output in git
        run: |
          tracked="$(git ls-files 'libs/*.tgz' 'libs/*/dist/*' 'WIP-Toolkit/dist/*')"
          if [ -n "$tracked" ]; then
            echo "Library build output is tracked; the scaffold builds it. Untrack it:"
            echo "$tracked"
            exit 1
          fi

  # Dependency vulnerability check
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Audit every shipped component's dependencies
        run: |
          . .venv/bin/activate
          pip install pip-audit
          # The in-repo libraries are not on PyPI. They are audited as
          # projects; the requirements files are audited without their
          # editable lines, which point at those libraries.
          status=0
          for p in libs/wip-auth libs/wip-archive deployer; do
            echo "== $p"
            pip-audit --desc on "$p" || status=1
          done
          for c in registry def-store template-store document-store \
                   reporting-sync ingest-gateway mcp-server auth-gateway; do
            echo "== components/$c"
            grep -v '^-e' "components/$c/requirements.txt" > "/tmp/req-$c.txt"
            pip-audit --desc on -r "/tmp/req-$c.txt" || status=1
          done
          # The toolkit depends on wip-archive, so install that first and
          # audit the toolkit's environment.
          echo "== WIP-Toolkit"
          python3 -m venv /tmp/toolkit-venv
          /tmp/toolkit-venv/bin/pip install -q ./libs/wip-archive ./WIP-Toolkit
          pip-audit --desc on --path "$(/tmp/toolkit-venv/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" || status=1
          exit $status

  # Components that need MongoDB.
  #
  # Database jobs get their own databases as job services: on a per-job
  # network, reached by service name, published on no host port, and
  # discarded with the job. CI therefore cannot collide with local test runs
  # (wip-test.sh), a WIP install or another CI job on the same machine. The
  # runner holds each job until its services report healthy.
  test-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component: [registry, def-store, template-store, document-store]
    services:
      mongo:
        image: mongo:7
        # MongoDB sizes its cache from the VM's memory; capped so a full
        # CI run fits beside a dev stack on the runner machine.
        cmd: ["--wiredTigerCacheSizeGB", "0.5"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: components/${{ matrix.component }}
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip install -r requirements.txt
          # Transport injection: component tests import registry.main in-process
          pip install -r ../registry/requirements.txt
          # pytest-httpx: document-store's dependency-outage tests mock the
          # template-store and def-store clients' HTTP calls (httpx_mock).
          pip install pytest pytest-asyncio httpx pytest-httpx

      - name: Run tests
        working-directory: components/${{ matrix.component }}
        env:
          MONGO_URI: mongodb://mongo:27017/
          PYTHONPATH: src:../registry/src
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/ -v --tb=short

  # Ingest gateway (NATS with JetStream)
  test-ingest-gateway:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2
        # cmd is Gitea-specific. It replaces the image's default command,
        # which enables monitoring but not JetStream.
        cmd: ["-js", "-m", "8222"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Wait for NATS
        run: |
          # The nats image has no shell for a container health check, so
          # wait on JetStream's health endpoint from the job instead.
          for i in $(seq 1 30); do
            curl -sf 'http://nats:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          echo "NATS JetStream not healthy after 30 s" >&2
          exit 1

      - name: Install dependencies
        working-directory: components/ingest-gateway
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          # requirements.txt pulls in wip-auth (the service authenticates
          # every route and its tests use wip_auth.testing).
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: components/ingest-gateway
        env:
          PYTHONPATH: src:tests
          NATS_TEST_URL: nats://nats:4222
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/ -v --tb=short

  # Reporting-sync (unit tests + PostgreSQL integration tests)
  test-reporting-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wip_test
        options: >-
          --health-cmd "pg_isready -U test -d wip_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      nats:
        image: nats:2
        # cmd is Gitea-specific. It replaces the image's default command,
        # which enables monitoring but not JetStream.
        cmd: ["-js", "-m", "8222"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Wait for NATS
        run: |
          # The nats image has no shell for a container health check, so
          # wait on JetStream's health endpoint from the job instead.
          for i in $(seq 1 30); do
            curl -sf 'http://nats:8222/healthz?js-enabled-only=true' && exit 0
            sleep 1
          done
          echo "NATS JetStream not healthy after 30 s" >&2
          exit 1

      - name: Install dependencies
        working-directory: components/reporting-sync
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip install -r requirements.txt
          # pytest-httpx: the startup-backfill tests mock the services' HTTP calls.
          pip install pytest pytest-asyncio httpx pytest-httpx

      - name: Run tests
        working-directory: components/reporting-sync
        env:
          PYTHONPATH: src
          POSTGRES_TEST_URI: postgresql://test:test@postgres:5432/wip_test
          NATS_TEST_URL: nats://nats:4222
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/ -v --tb=short

  # MCP server (no DB needed)
  test-mcp-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: components/mcp-server
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: components/mcp-server
        env:
          PYTHONPATH: src
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/ -v --tb=short

  # Auth gateway (no DB needed)
  test-app-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          # The sync loop is stdlib-only; the tests need only pytest.
          pip install pytest

      - name: Run tests
        working-directory: components/app-edge
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/ -v --tb=short

  test-auth-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        working-directory: components/auth-gateway
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        working-directory: components/auth-gateway
        env:
          PYTHONPATH: src
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest tests/ -v --tb=short

  # wip-auth library
  test-wip-auth:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        # MongoDB sizes its cache from the VM's memory; capped so a full
        # CI run fits beside a dev stack on the runner machine.
        cmd: ["--wiredTigerCacheSizeGB", "0.5"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install -e "libs/wip-auth[dev]"
          # Transport injection: test_fastapi_helpers imports registry.main in-process
          # Install registry deps but skip the editable wip-auth line (already installed above;
          # the relative path in requirements.txt is for components/registry/ working dir)
          grep -v '^\-e' components/registry/requirements.txt | pip install -r /dev/stdin

      - name: Run tests
        env:
          MONGO_URI: mongodb://mongo:27017/
          PYTHONPATH: components/registry/src
        run: |
          . .venv/bin/activate
          pytest libs/wip-auth/tests/ -v --tb=short

  # wip-archive library (archive format + id remap) — pure unit tests
  test-wip-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          pip install -e libs/wip-archive pytest

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest libs/wip-archive/tests/ -v --tb=short

  # The TypeScript libraries apps vendor (@wip/client, @wip/react, @wip/proxy):
  # a clean install from the committed lockfile, the type check and the unit
  # tests. A clean `npm ci` is part of the check: a lockfile out of step with
  # package.json (wip-react's once still recorded @wip/client 0.62.0 against
  # 0.92.0) fails here instead of on the next person's checkout.
  test-ts-libs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib: [wip-client, wip-react, wip-proxy]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install from the lockfile
        working-directory: libs/${{ matrix.lib }}
        run: npm ci --no-audit --no-fund

      # @wip/react links file:../wip-client and type-checks against its
      # dist/, which is not tracked: build the client first.
      - name: Build the linked @wip/client
        if: matrix.lib == 'wip-react'
        working-directory: libs/wip-client
        run: npm ci --no-audit --no-fund && npm run build

      - name: Type check
        working-directory: libs/${{ matrix.lib }}
        run: npm run typecheck

      - name: Unit tests
        working-directory: libs/${{ matrix.lib }}
        run: npm test

  # Deployer (wip-deploy CLI) — pure unit tests, no DB or NATS needed
  test-deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install deployer
        run: |
          . .venv/bin/activate
          pip install -e deployer
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest deployer/tests/unit/ -v --tb=short

  # Scaffold engine (CASE-612). Unit tests only — the golden-snapshot
  # tests are opt-in (WIP_GOLDEN=1, need podman + a running install +
  # BSD sed) and skip themselves here.
  test-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install pytest
        run: |
          . .venv/bin/activate
          pip install pytest

      - name: Run tests
        run: |
          . .venv/bin/activate
          cd scaffold && PYTHONPATH=src pytest tests/ -v --tb=short

  # WIP-Toolkit
  test-wip-toolkit:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        # MongoDB sizes its cache from the VM's memory; capped so a full
        # CI run fits beside a dev stack on the runner machine.
        cmd: ["--wiredTigerCacheSizeGB", "0.5"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      # tests/integration/ mounts registry, def-store, template-store, and
      # document-store in-process against a real MongoDB. Without mongo +
      # the services' requirements the integration tests SKIP — which
      # would silently turn the round-trip guard back into theater, so CI
      # provisions both (MongoDB as the job's mongo service).
      - name: Install dependencies
        run: |
          . .venv/bin/activate
          # wip-archive first: the toolkit's pyproject declares it as a
          # dependency, and it lives in this repo, not on PyPI — a bare
          # `pip install -e WIP-Toolkit` dies resolving it.
          pip install -e libs/wip-archive
          pip install -e WIP-Toolkit
          # The component requirements files carry an editable install
          # (-e ../../libs/wip-auth) whose relative path pip resolves against
          # the CURRENT working directory, not the requirements file's
          # location. Installing them from the repo root makes that path
          # climb out of the checkout and the whole job dies before pytest
          # runs. Install each file from its component dir instead —
          # mirroring test-services' working-directory.
          for c in registry def-store template-store document-store; do
            (cd "components/$c" && pip install -r requirements.txt)
          done
          pip install pytest

      - name: Run tests
        env:
          MONGO_URI: mongodb://mongo:27017/
        run: |
          . .venv/bin/activate
          pytest WIP-Toolkit/tests/ -v --tb=short
