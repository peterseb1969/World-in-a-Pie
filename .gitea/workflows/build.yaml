name: Build & Push Release Images

on:
  push:
    tags: ['v*']

jobs:
  # Runs in host mode on the development Mac (runner label macos-host): the
  # images are built by the Mac's podman, which a job container cannot reach.
  build-and-push:
    runs-on: macos-host
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Login to Gitea registry
        run: |
          echo "${{ secrets.GITEA_REGISTRY_TOKEN }}" | \
            podman login --tls-verify=false gitea.internal:3000 -u peter --password-stdin

      - name: Build and push all images
        run: |
          bash scripts/build-release.sh \
            --registry gitea.internal:3000/peter \
            --tag "${{ steps.tag.outputs.version }}" \
            --push \
            --insecure \
            --builder podman
