[build-system]
# Pinned so an unchanged tree rebuilds to identical bytes: the backend stamps
# its own version into the wheel, and apps vendor these wheels by version.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "wip-archive"
version = "0.6.0"
description = "WIP backup archive format contract and fresh-restore id remapping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wip_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
