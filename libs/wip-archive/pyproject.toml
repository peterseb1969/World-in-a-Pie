[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wip-archive"
version = "0.1.0"
description = "WIP backup archive format contract and fresh-restore id remapping"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wip_archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
