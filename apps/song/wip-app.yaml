api_version: wip.dev/v1
kind: App
metadata:
  name: song
  category: optional
  description: |
    WIP-Song — song teaching and singing app. Records the user's singing,
    translates it into notes, scores it against target melodies (piano-roll
    and guitar-fretboard views), imports MIDI/karaoke files, and tracks
    lesson progress. App source lives in its own repo (WIP-Song).

spec:
  # Namespaces this app owns. The install reserves them, and the app's own key
  # (admin on them) creates them exactly as reserved. Settings mirror what the
  # app's bootstrap sends on create, which must equal the reservation.
  # Not checked against the app's source (not on the platform host): the
  # namespace is taken from this manifest's own env/comments.
  namespaces:
    - {role: main, name: dev-wip-song, env: WIP_NAMESPACE}
  image:
    name: wip-song
    tag: dev

  ports:
    - {name: http, container_port: 3016}
    # Vite dev server (CASE-55/57). Used only with
    # `wip-deploy install --target dev --app-source song=<path>`.
    - {name: dev, container_port: 5181}

  env:
    required:
      - {name: WIP_BASE_URL, source: {from_component: router}}
      - {name: APP_BASE_PATH, source: {literal: /apps/song}}
      - {name: VITE_BASE_PATH, source: {literal: /apps/song}}
      - {name: PORT, source: {literal: "3016"}}
      - {name: NODE_ENV, source: {literal: production}}
    optional:
      # AskBar agent (scaffold feature); app degrades gracefully without it.
      - {name: ANTHROPIC_API_KEY, source: {from_secret: anthropic-api-key, supplied_by: operator}}
      - {name: MCP_URL, source: {literal: "http://wip-router:8080/mcp"}}

  routes:
    - {path: /apps/song, auth_required: true}

  depends_on: [document-store]

  healthcheck:
    # Locally answerable; must not require WIP to be reachable (contract).
    endpoint: /apps/song/api/health
    probe: auto
    start_period_seconds: 15

app_metadata:
  display_name: WIP-Song
  route_prefix: /apps/song
  ui_only: false
