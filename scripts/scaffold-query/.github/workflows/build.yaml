name: Build & Push Image (x86)

# Manually triggered: Actions tab -> Run workflow. Builds the production
# image and pushes it to GHCR as ghcr.io/<owner>/wip-SCAFFOLD_APP_SLUG:<tag>.
# Empty tag input falls back to sha-<short>. VITE_BASE_PATH must match the
# platform manifest's APP_BASE_PATH (apps/wip-SCAFFOLD_APP_SLUG/wip-app.yaml in
# World-in-a-Pie). VITE_BUILD_STAMP / VITE_BUILD_SHA stamp the running-app
# footer (CASE-472); unset → the Dockerfile's 'dev' default → UI hides it.
#
# Scaffold-owned (CASE-489): this file is generated by create-app-project.sh
# from scripts/scaffold-query/.github/workflows/build.yaml — cross-cutting CI
# changes belong in that template, not edited per-app. Only SCAFFOLD_APP_SLUG
# is substituted at scaffold time.
#
# Platforms: default native amd64. Set the platforms input to e.g.
# "linux/amd64,linux/arm64" for a multi-arch manifest via buildx + QEMU
# (emulated arm64 npm ci/build is slow).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 1.0.0). Leave empty for sha-<short-commit>.'
        required: false
        default: ''
      platforms:
        description: 'Comma-separated platforms. Default native amd64; e.g. linux/amd64,linux/arm64 for multi-arch (QEMU, slow).'
        required: false
        default: 'linux/amd64'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building with tag: $TAG"

      - name: Set up QEMU (multi-arch only)
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          docker buildx build \
            --platform "${{ inputs.platforms }}" \
            --build-arg VITE_BASE_PATH=/apps/SCAFFOLD_APP_SLUG/ \
            --build-arg VITE_BUILD_STAMP="$(date -u +%FT%TZ)" \
            --build-arg VITE_BUILD_SHA="$(git rev-parse --short HEAD)" \
            -t "ghcr.io/${{ github.repository_owner }}/wip-SCAFFOLD_APP_SLUG:${{ steps.tag.outputs.tag }}" \
            --push .
